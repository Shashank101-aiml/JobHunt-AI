name: CI/CD Quality & Test Automation Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      run_llm_eval:
        description: 'Force execution of full DeepEval LLM evaluation suite'
        required: false
        default: true
        type: boolean
      eval_model_provider:
        description: 'LLM Evaluation Judge Provider (offline heuristic or external provider)'
        required: false
        default: 'offline'
        type: choice
        options:
          - offline
          - anthropic
          - openai

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  DATABASE_URL: 'sqlite+aiosqlite:///./data/ci_test.db'
  ENVIRONMENT: 'test'
  SCRAPER_TIMEOUT_SECONDS: '10'
  ANTHROPIC_API_KEY: 'ci-mock-anthropic-key-no-cost'
  OPENAI_API_KEY: 'ci-mock-openai-key-no-cost'

jobs:
  # =========================================================================
  # 1. UNIT & COMPONENT TESTS (Fast feedback first)
  # =========================================================================
  unit-tests:
    name: Backend Unit & Component Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Create Data Directories
        run: |
          mkdir -p data/resumes data/exports chroma_db

      - name: Run Pytest Unit & Integration Tests with Coverage
        run: |
          pytest tests/test_*.py -v --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-unit-coverage
          path: coverage.xml
          retention-days: 14

  # =========================================================================
  # 2. BACKEND API AUTOMATION TESTS
  # =========================================================================
  api-tests:
    name: Pytest + Requests Backend API Automation
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Create Data Directories
        run: |
          mkdir -p data/resumes data/exports chroma_db docs/reports

      - name: Start FastAPI Test Server
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo "Waiting for FastAPI server to become healthy..."
          timeout 30s bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 1; done'
          echo "FastAPI test server is ready!"

      - name: Run Pytest + Requests API Automation Suite
        env:
          API_BASE_URL: 'http://127.0.0.1:8000'
        run: |
          pytest tests/api/ -v --html=docs/reports/api_test_report.html --self-contained-html

      - name: Upload API Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: docs/reports/api_test_report.html
          retention-days: 14

  # =========================================================================
  # 3. PLAYWRIGHT BROWSER END-TO-END TESTS
  # =========================================================================
  e2e-tests:
    name: Playwright Browser End-to-End Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          mkdir -p data/resumes data/exports chroma_db

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium with OS Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start FastAPI Backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          timeout 30s bash -c 'until curl -sf http://127.0.0.1:8000/health; do sleep 1; done'

      - name: Run Playwright E2E Tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright Test Report & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-artifacts
          path: |
            docs/reports/playwright-report/
            docs/reports/playwright_e2e_report.md
            frontend/test-results/
          retention-days: 14

  # =========================================================================
  # 4. DEEPEVAL LLM OUTPUT EVALUATION (Controlled & Independent)
  # =========================================================================
  llm-eval:
    name: DeepEval LLM Output Evaluation
    needs: unit-tests
    # Runs on manual trigger, or push to main, or PRs touching tailoring/prompts/eval
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      contains(github.event.pull_request.labels.*.name, 'run-llm-eval')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Execute DeepEval Synthetic Dataset Evaluation
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'
          DEEPEVAL_JUDGE_PROVIDER: ${{ github.event.inputs.eval_model_provider || 'offline' }}
        run: |
          python tests/eval/run_evaluation.py

      - name: Run Pytest Schema & Adversarial LLM Guardrail Tests
        run: |
          pytest tests/eval/test_safety_adversarial.py tests/eval/test_schema_validation.py -v

      - name: Upload DeepEval Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepeval-evaluation-report
          path: |
            docs/reports/deepeval_evaluation_report.md
            docs/reports/deepeval_evaluation_report.json
          retention-days: 30

  # =========================================================================
  # 5. DOCKER CONTAINER BUILD VERIFICATION
  # =========================================================================
  docker-build:
    name: Docker Container Build
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: jobhunt-ai:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
